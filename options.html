<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Inspector Settings</title>
  <style>
    body{margin:0;background:#eef1f6;color:#172033;font:14px system-ui,sans-serif}
    main{max-width:680px;margin:50px auto;padding:28px;background:#fff;border:1px solid #e4e8f0;border-radius:16px;box-shadow:0 4px 14px rgba(23,32,51,.05)}
    h1{margin-top:0} p{color:#8890a1}
    label{display:block;font-weight:700;margin:22px 0 7px}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2dd;border-radius:9px;font-size:14px}
    button{margin-top:18px;padding:11px 18px;border:0;border-radius:9px;background:#3557f6;color:white;font-weight:700;cursor:pointer}
    #status{margin-left:10px;color:#15945b}
    code{background:#f0f2f6;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <main>
    <h1>IP Inspector Settings</h1>
    <p>API keys are requested on first run and stored locally by the extension. Lookups are made directly to ProxyCheck and VPNAPI; no Flask backend is required.</p>

    <label for="proxyKey">ProxyCheck API Key</label>
    <input id="proxyKey" type="password" autocomplete="off" placeholder="Enter ProxyCheck API key">

    <label for="vpnKey">VPNAPI API Key</label>
    <input id="vpnKey" type="password" autocomplete="off" placeholder="Enter VPNAPI API key">

    <button id="saveKeys">Save API keys</button>
    <button id="clearKeys" style="margin-left:8px;background:#d83a3a">Clear saved API keys</button>
    <span id="status"></span>

    <p>ProxyCheck and VPNAPI are called directly from the extension using the saved keys.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
